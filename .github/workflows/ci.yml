name: CI

# Runs the verification smoke harness and the records linter on every pull
# request, merge-group entry and push to main.
# - No path filters; a started main run is never cancelled.
# - Each merge-queue entry gets its own concurrency group keyed on its head
#   SHA, so a queued entry is never superseded while pending.
# - Tools: Icarus Verilog from the runner image (apt), cocotb installed at the
#   version pinned in scripts/setup-env.sh (the one pin source).
# - PDK, synthesis and place-and-route legs do not exist yet; when added they
#   stay local and recorded under verification/records/.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('ci-mq-{0}', github.event.merge_group.head_sha) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install cocotb at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_COCOTB="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin"
          python3 -m venv .venv
          .venv/bin/pip install "cocotb==${pin}"
      - name: Without cocotb the harness must fail, not skip
        run: |
          if make -C verification smoke >/tmp/no-cocotb.log 2>&1; then
            echo "smoke passed without cocotb -- the guard is broken" >&2
            cat /tmp/no-cocotb.log >&2
            exit 1
          fi
          grep -q "cocotb not importable" /tmp/no-cocotb.log
      - name: Smoke test, recorded
        run: |
          . .venv/bin/activate
          make -C verification smoke
      - name: Records linter and its fixture test
        run: |
          python3 -I verification/tools/lint_records.py
          python3 -I verification/tools/tests/test_lint_records.py
