name: CI

# Runs the verification smoke harness and the records linter on every pull
# request, merge-group entry and push to main.
# - No path filters; a started main run is never cancelled.
# - Each merge-queue entry gets its own concurrency group keyed on its head
#   SHA, so a queued entry is never superseded while pending.
# - Tools: Icarus Verilog built from source at the version pinned in
#   scripts/setup-env.sh (the runner image's apt package is older than the
#   pin), cocotb installed at the version pinned in the same file (the one
#   pin source); the job verifies the environment against both pins before
#   anything runs.
# - PDK, synthesis and place-and-route legs do not exist yet; when added they
#   stay local and recorded under verification/records/.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('ci-mq-{0}', github.event.merge_group.head_sha) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the default pull_request checkout: the refs/pull/N/merge
          # tip, so smoke (the repo's only CI job) verifies the base+head
          # merge result before it lands. Full history is what the stamp
          # guard below needs — it judges
          # `git log <base>..HEAD -- WORK_PLAN.md`, which must traverse
          # merge topology, and refuses a shallow clone outright.
          fetch-depth: 0
      - name: Install Icarus Verilog at the pinned version (source build)
        run: |
          pin="$(sed -n 's/^PIN_IVERILOG="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin"
          # Release tags follow v<major>_<minor>: pin 13.0 -> tag v13_0. A pin
          # that does not map to a published tag fails here, visibly.
          tag="v${pin//./_}"
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf gperf flex bison libreadline-dev
          git clone --depth 1 --branch "$tag" https://github.com/steveicarus/iverilog.git /tmp/iverilog-src
          cd /tmp/iverilog-src
          sh autoconf.sh
          ./configure
          make -j"$(nproc)"
          sudo make install
      - name: Install cocotb at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_COCOTB="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin"
          python3 -m venv .venv
          .venv/bin/pip install "cocotb==${pin}"
      - name: Environment must match the pins
        run: |
          . .venv/bin/activate
          scripts/setup-env.sh --check
      - name: Without cocotb the harness must fail, not skip
        run: |
          if make -C verification smoke >/tmp/no-cocotb.log 2>&1; then
            echo "smoke passed without cocotb -- the guard is broken" >&2
            cat /tmp/no-cocotb.log >&2
            exit 1
          fi
          grep -q "cocotb not importable" /tmp/no-cocotb.log
      - name: Smoke test, recorded
        run: |
          . .venv/bin/activate
          make -C verification smoke
      - name: Records linter and its fixture test
        run: |
          python3 -I verification/tools/lint_records.py
          python3 -I verification/tools/tests/test_lint_records.py
          python3 -I verification/tools/tests/test_run_flow_smoke.py
      - name: setup-env check-mode fixture test (issue #21)
        # Hermetic: every tool is a stub, so this runs on the bare runner and
        # pins both --check (simulation pins only, the shape this job needs)
        # and --check-flow (fail, never skip, on a flow-pin problem).
        run: |
          scripts/tests/test-setup-env.sh
      - name: WORK_PLAN stamp guard and its fixture test (issue #11)
        run: |
          scripts/tests/test-check-work-plan-stamp.sh
          # Judge only the commits this event adds: the PR's range, the
          # merge-queue entry's range, or the pushed commits on main. An
          # empty or all-zero base (branch creation) falls back to judging
          # HEAD's full history; a base that does not resolve is exit 2
          # (loud), never a silent pass.
          base='${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}'
          if [[ "$base" =~ ^0+$ ]]; then
            base=''
          fi
          scripts/check-work-plan-stamp.sh "$base"
